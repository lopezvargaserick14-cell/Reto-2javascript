<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Notas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta">
            <form id="formulario-alumno">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
                <label for="nota1">Certamen 1:</label>
                <input type="number" id="nota1" min="0" max="100" required>
                <label for="nota2">Certamen 2:</label>
                <input type="number" id="nota2" min="0" max="100" required>
                <label for="nota3">Certamen 3:</label>
                <input type="number" id="nota3" min="0" max="100" required>
                <button type="submit">Agregar Alumno</button>
            </form>
        </section>
        <section class="tarjeta" id="resultados"></section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
